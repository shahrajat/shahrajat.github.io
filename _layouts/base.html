<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl }}" />
    {% if page.css %}
      {% for css in page.css %}
      <link rel="stylesheet" href="{{ css | prepend: site.baseurl | replace: '//', '/' }}" />
      {% endfor %}
    {% endif %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml" />
    {% seo %}
  </head>
  <body>
    {% include nav.html %}
    <main class="site-content">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.js %}
      {% for js in page.js %}
      <script src="{{ js | prepend: site.baseurl | replace: '//', '/' }}"></script>
      {% endfor %}
    {% endif %}
  </body>
</html>
